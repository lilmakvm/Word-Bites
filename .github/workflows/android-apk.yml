
name: Build Word Bites Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync app into Android project
        run: npx cap sync android

      - name: Install image processing tool
        run: npm install --no-save sharp

      - name: Generate all Word Bites launcher icons
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs';

          const source = 'public/resources/word-bites-icon.png';

          if (!fs.existsSync(source)) {
            throw new Error(`Icon not found: ${source}`);
          }

          const densities = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };

          // Generate standard launcher icons.
          for (const [folder, size] of Object.entries(densities)) {
            const dir = `android/app/src/main/res/${folder}`;
            fs.mkdirSync(dir, { recursive: true });

            for (const name of ['ic_launcher', 'ic_launcher_round']) {
              await sharp(source)
                .resize(size, size, { fit: 'contain' })
                .png()
                .toFile(`${dir}/${name}.png`);
            }
          }

          // Generate the adaptive icon foreground.
          const foregroundDir =
            'android/app/src/main/res/drawable-nodpi';

          fs.mkdirSync(foregroundDir, { recursive: true });

          const iconBuffer = await sharp(source)
            .resize(264, 264, { fit: 'contain' })
            .png()
            .toBuffer();

          await sharp({
            create: {
              width: 432,
              height: 432,
              channels: 4,
              background: {
                r: 0,
                g: 0,
                b: 0,
                alpha: 0
              }
            }
          })
            .composite([{ input: iconBuffer, gravity: 'centre' }])
            .png()
            .toFile(
              `${foregroundDir}/word_bites_launcher_foreground.png`
            );

          // Generate adaptive icon background color.
          const valuesDir = 'android/app/src/main/res/values';
          fs.mkdirSync(valuesDir, { recursive: true });

          fs.writeFileSync(
            `${valuesDir}/word_bites_launcher.xml`,
            `<resources>
              <color name="word_bites_launcher_background">#FFFFFF</color>
            </resources>`
          );

          // Replace Android adaptive launcher icon definitions.
          const adaptiveDir =
            'android/app/src/main/res/mipmap-anydpi-v26';

          fs.mkdirSync(adaptiveDir, { recursive: true });

          const adaptiveXml = `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/word_bites_launcher_background"/>
              <foreground android:drawable="@drawable/word_bites_launcher_foreground"/>
          </adaptive-icon>`;

          fs.writeFileSync(
            `${adaptiveDir}/ic_launcher.xml`,
            adaptiveXml
          );

          fs.writeFileSync(
            `${adaptiveDir}/ic_launcher_round.xml`,
            adaptiveXml
          );

          console.log('All Word Bites launcher icons generated.');
          NODE

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-bites-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
